<style>
/* Layout: an academic press masthead (series band, crest, title, CEFR scale), then a dictionary ledger: headword left, definition right; stacks on phones. */
:root{
  --paper:#F4EEDF; --paper-deep:#EAE1CB; --sheet:#FBF7EE; --rule:#D9CCAE; --rule-soft:#E6DCC4;
  --ink:#1B2333; --muted:#6E6655; --accent:#7B1E2C; --accent-soft:#EFDCD8; --sage:#8FB0A0;
  --display:"Cormorant Garamond","Garamond","Times New Roman",serif;
  --body:"Source Serif 4","Georgia","Times New Roman",serif;
  --ui:"Source Sans 3","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* Series band */
.band{background:var(--ink);color:var(--paper)}
.band .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.band span{font-family:var(--ui);font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.band .btn-link{background:none;border:1px solid rgba(244,238,223,.35);color:var(--paper);font-family:var(--ui);font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:6px 12px;cursor:pointer}
.band .btn-link:hover{border-color:var(--paper)}

/* Masthead */
.mast{padding-block:56px 40px;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:auto minmax(0,1fr);gap:36px;align-items:start}
.crest{width:96px;height:96px;border-radius:50%;border:1.5px solid var(--accent);display:grid;place-items:center;position:relative;color:var(--accent)}
.crest::before{content:"";position:absolute;inset:6px;border-radius:50%;border:1px solid var(--rule)}
.crest b{font-family:var(--display);font-size:38px;font-weight:600;font-style:italic;letter-spacing:.02em}
.eyebrow{font-family:var(--ui);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 10px}
.title{font-family:var(--display);font-weight:600;font-size:clamp(56px,10vw,112px);line-height:.92;margin:0;letter-spacing:-.01em;text-wrap:balance}
.title em{font-style:italic;color:var(--accent);font-weight:600}
.sub{font-family:var(--display);font-style:italic;font-size:clamp(22px,2.8vw,30px);color:var(--muted);margin:10px 0 0;font-weight:500}
.byline{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:28px;padding-top:18px;border-top:1px solid var(--rule-soft);max-width:620px}
.byline .lbl{font-family:var(--ui);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.byline .name{font-family:var(--display);font-size:26px;font-weight:600;letter-spacing:.06em;font-variant:small-caps}
.byline a.name{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--rule)}
.byline a.name:hover{border-color:var(--accent)}
.byline .role{font-family:var(--body);font-style:italic;font-size:15px;color:var(--muted)}

/* CEFR scale */
.cefr{margin-top:28px;max-width:620px}
.cefr-row{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--rule);background:var(--sheet)}
.cefr-row div{font-family:var(--ui);font-weight:600;font-size:13px;letter-spacing:.06em;text-align:center;padding:9px 0;color:var(--muted);border-right:1px solid var(--rule-soft)}
.cefr-row div:last-child{border-right:0}
.cefr-row .on{background:var(--accent);color:var(--sheet)}
.cefr-cap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--ui);font-size:12px;color:var(--muted);margin-top:8px;letter-spacing:.04em}

/* Intro */
.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px;padding-block:32px;border-bottom:1px solid var(--rule)}
.intro p{margin:0;max-width:44ch}
.intro .en{font-style:italic;color:var(--muted)}

/* Controls */
.controls{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap;padding-block:28px 18px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:var(--sheet);border:1px solid var(--rule);padding:0 16px}
.search:focus-within{border-color:var(--ink)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;padding:14px 0;outline:none;font-family:var(--body)}
.count{display:flex;align-items:baseline;gap:8px;padding:12px 18px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--ui);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.count b{font-family:var(--display);font-size:26px;color:var(--accent);line-height:1}

/* Ledger */
.head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:32px;padding:10px 24px;font-family:var(--ui);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);border-top:2px solid var(--ink);border-bottom:1px solid var(--rule)}
.list{background:var(--sheet);border-bottom:2px solid var(--ink)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:32px;padding:26px 24px;border-bottom:1px solid var(--rule-soft);position:relative;transition:background .2s}
.row:last-child{border-bottom:0}
.row:hover{background:#FFFDF8}
.word{min-width:0}
.word h3{font-family:var(--display);font-size:clamp(28px,3.4vw,36px);font-weight:700;margin:0;line-height:1.05;overflow-wrap:anywhere}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.type{font-family:var(--body);font-style:italic;font-size:15px;color:var(--accent)}
.speak{cursor:pointer;background:none;border:1px solid var(--rule);color:var(--muted);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;padding:0;transition:color .15s,border-color .15s}
.speak:hover{color:var(--accent);border-color:var(--accent)}
.lvl{font-family:var(--ui);font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--sheet);background:var(--ink);padding:2px 6px}
.def{min-width:0}
.def p{margin:0;max-width:60ch}
.def .ex{margin-top:12px;font-style:italic;color:var(--muted);font-size:16px;padding-left:14px;border-left:2px solid var(--sage)}
.del{position:absolute;top:14px;right:14px;cursor:pointer;background:var(--sheet);border:1px solid var(--rule);color:var(--accent);font-family:var(--ui);font-size:12px;padding:4px 10px}
.del:hover{border-color:var(--accent)}
.del.confirm{background:var(--accent);color:var(--sheet);border-color:var(--accent)}
.empty{padding:56px 24px;text-align:center;color:var(--muted);font-style:italic}
.demo{font-family:var(--ui);font-size:12px;letter-spacing:.06em;color:var(--accent);background:var(--accent-soft);padding:8px 14px;margin-bottom:14px}

/* Teacher panel */
.panel{border:1px solid var(--ink);background:var(--sheet);padding:24px;margin-top:28px;display:grid;gap:16px}
.panel h2{margin:0;font-family:var(--display);font-size:26px;font-weight:600}
.panel h2 small{display:block;font-family:var(--ui);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.field{display:grid;gap:6px;min-width:0}
.field label{font-family:var(--ui);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field input,.field textarea,.field select{background:var(--paper);border:1px solid var(--rule);padding:11px 12px;width:100%;min-width:0;font-family:var(--body)}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--ink);outline:none}
.field textarea{resize:vertical;min-height:84px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{cursor:pointer;border:1px solid var(--ink);background:transparent;padding:11px 20px;font-family:var(--ui);font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent)}
.btn:not(.primary):hover{border-color:var(--accent);color:var(--accent)}
.msg{font-family:var(--ui);font-size:13px;color:var(--muted)}
.msg.err{color:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);font-family:var(--ui);font-size:14px;padding:10px 18px;z-index:20;max-width:calc(100% - 32px)}
footer{padding-block:32px 48px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--ui);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

@media (max-width:720px){
  .mast{grid-template-columns:1fr;gap:24px;padding-block:36px 28px}
  .crest{width:72px;height:72px}.crest b{font-size:28px}
  .intro{grid-template-columns:1fr;gap:12px}
  .head{display:none}
  .row{grid-template-columns:1fr;gap:12px;padding:22px 18px}
  .grid2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Definición grande y centrada */
.row{align-items:center}
.def{text-align:center}
.def p{margin:0 auto;font-family:var(--display);font-size:clamp(24px,3vw,32px);font-weight:600;line-height:1.25}
.def .ex{font-family:var(--body);font-size:16px;font-weight:400;line-height:1.5;border-left:0;padding-left:0;margin-top:10px}
/* Numeración */
.num{display:block;margin-bottom:6px;font-family:var(--ui);font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--accent);font-variant-numeric:tabular-nums lining-nums}
/* Traducción + definición proporcional */
.def p{font-size:clamp(20px,2.2vw,24px);font-weight:500;line-height:1.4}
.def .ex{font-size:15px}
.tr{margin:6px 0 0;font-family:var(--body);font-size:clamp(17px,1.8vw,19px);color:var(--muted)}
.tr::before{content:"ES  ";font-family:var(--ui);font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--accent)}
/* Editar */
.edit{position:absolute;top:14px;right:14px;cursor:pointer;background:var(--sheet);border:1px solid var(--rule);color:var(--ink);font-family:var(--ui);font-size:12px;padding:4px 10px}
.edit:hover{border-color:var(--ink)}
.row .del{top:50px}
.row:has(.edit){padding-right:140px}
@media (max-width:720px){.row:has(.edit){padding-right:18px}.row .edit,.row .del{position:static;justify-self:start}}
/* Categorías y vistas */
.cat{font-family:var(--ui);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:2px 8px}
.viewbar{display:flex;margin-bottom:18px;border:1px solid var(--rule);background:var(--sheet);width:max-content;max-width:100%}
.viewbar button{cursor:pointer;background:none;border:0;border-right:1px solid var(--rule-soft);padding:10px 18px;font-family:var(--ui);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.viewbar button:last-child{border-right:0}
.viewbar button.on{background:var(--accent);color:var(--sheet)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{cursor:pointer;background:var(--sheet);border:1px solid var(--rule);padding:6px 12px;font-family:var(--ui);font-size:13px;color:var(--ink)}
.chip:hover{border-color:var(--accent)}
.chip b{font-weight:600;color:var(--accent);margin-left:4px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.on b{color:var(--paper)}
.boxes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
.box{border:1px solid var(--rule);border-top:3px solid var(--accent);background:var(--sheet)}
.box-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0;padding:14px 18px;font-family:var(--display);font-size:26px;font-weight:700;border-bottom:1px solid var(--rule)}
.box-h b{font-family:var(--ui);font-size:12px;background:var(--accent);color:var(--sheet);padding:2px 8px;letter-spacing:.06em}
.bw{padding:16px 18px;border-bottom:1px solid var(--rule-soft)}
.bw:last-child{border-bottom:0}
.bw-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bw h3{font-family:var(--display);font-size:26px;font-weight:700;margin:0;line-height:1.1;overflow-wrap:anywhere}
.bw .tr{margin:4px 0 0;font-size:16px}
.bw-def{margin:8px 0 0;font-size:16px;line-height:1.45}
.bw-ex{margin:8px 0 0;font-size:15px;font-style:italic;color:var(--muted);padding-left:12px;border-left:2px solid var(--sage)}
.bw-act{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.qcat{background:var(--paper);border:1px solid var(--rule);padding:4px 8px;font-family:var(--ui);font-size:12px;max-width:100%}
.bw-act .edit,.bw-act .del{position:static}
@media (max-width:720px){.boxes{grid-template-columns:1fr}}
</style>

<script>

var app=document.getElementById('app');
var auth=null, db=null, words=[], session=null, q='', loading=true, loadError='', pendingDel=null, showLogin=false, busy=false, demo=false;
var editing=null, view='list', catFilter='';
var CATS=[
 'Additive Connector','Contrasting Connector','Concessive Connector','Causal Connector','Consequence Connector',

 'Summarizing & Clarifying Connector','Discourse Marker',

];, view='list', catFilter='';

 /* Connectors / linkers */
 'Contrasting Connector','Additive Connector','Causal Connector','Consequence Connector','Concessive Connector',

];
var TYPES=['noun','verb','adjective','adverb','phrasal verb','idiom','collocation','preposition','conjunction','expression'];
var DEMO=[
 {id:'d1',word:'acknowledge',part_of_speech:'verb',definition:'To accept or admit that something is true or exists.',example:'She acknowledged her mistake immediately.'},

];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(t){var el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(function(){el.remove()},2800)}
function sortWords(){words.sort(function(a,b){return (a.t0||0)-(b.t0||0)||a.word.localeCompare(b.word,'en',{sensitivity:'base'})})}
function filtered(){var s=q.trim().toLowerCase();if(!s)return words;return words.filter(function(x){return (x.word+' '+x.definition+' '+(x.part_of_speech||'')+' '+(x.example||'')+' '+(x.translation||'')+' '+(x.category||'')).toLowerCase().indexOf(s)>-1})}
function speak(w){
  if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){toast('Abre la página en Safari o Chrome para escuchar el audio');return}
  var s=window.speechSynthesis,u=new SpeechSynthesisUtterance(w),vs=s.getVoices()||[];

}

var SPK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';

function rowHTML(x){
  return '<article class="row">'+
    '<div class="word"><span class="num">Nº '+String(words.indexOf(x)+1).padStart(2,'0')+'</span><h3>'+esc(x.word)+'</h3>'+(x.translation?'<p class="tr">'+esc(x.translation)+'</p>':'')+'<div class="meta">'+(x.part_of_speech?'<span class="type">'+esc(x.part_of_speech)+'</span>':'')+

    '<div class="def"><p>'+esc(x.definition)+'</p>'+(x.example?'<p class="ex">'+esc(x.example)+'</p>':'')+'</div>'+
    (session?'<button class="edit" data-edit="'+esc(x.id)+'">Editar</button>':'')+
    (session?'<button class="del'+(pendingDel===x.id?' confirm':'')+'" data-del="'+esc(x.id)+'">'+(pendingDel===x.id?'¿Confirmar?':'Borrar')+'</button>':'')+
  '</article>';
}

function adminHTML(){
  if(!session){
    if(!showLogin)return '';
    return '<div class="panel" id="lockpanel"><h2><small>Acceso restringido</small>Área del profesor</h2>'+
      '<div class="grid2"><div class="field"><label for="em">Correo · Email</label><input id="em" type="email" autocomplete="username"></div>'+
      '<div class="field"><label for="pw">Clave · Password</label><input id="pw" type="password" autocomplete="current-password"></div></div>'+

  }
  return '<div class="panel" id="wordpanel"><h2><small>Modo profesor</small>'+(editing?'Editar: '+esc(editing.word):'Añadir una palabra')+'</h2>'+

    '<div class="field"><label for="nt">Parte de la oración · Part of speech</label><select id="nt"><option value="">—</option>'+TYPES.map(function(t){return '<option>'+t+'</option>'}).join('')+'</select></div></div>'+
    '<div class="field"><label for="nr">Traducción al español</label><input id="nr" autocomplete="off"></div>'+
    '<div class="field"><label for="nc">Tipo de palabra · Categoría (elige o escribe)</label><input id="nc" list="catlist" autocomplete="off" placeholder="Ej. Contrasting Connector"><datalist id="catlist">'+allCats().map(function(c){return '<option value="'+esc(c)+'"></option>'}).join('')+'</datalist></div>'+
    '<div class="field"><label for="nd">Definición · Definition</label><textarea id="nd"></textarea></div>'+
    '<div class="field"><label for="ne">Ejemplo (opcional) · Example</label><input id="ne" autocomplete="off"></div>'+
    '<div class="actions"><button class="btn primary" id="add">'+(editing?'Guardar cambios':'Agregar palabra')+'</button>'+(editing?'<button class="btn" id="cancelEdit">Cancelar edición</button>':'')+'<button class="btn" id="lock">Cerrar sesión</button><span class="msg" id="addmsg"></span></div></div>';
}

function listHTML(){
  if(loading)return '<div class="empty">Cargando vocabulario…</div>';
  if(loadError)return '<div class="empty">'+esc(loadError)+'</div>';
  var l=filtered();
  if(l.length)return l.map(rowHTML).join('');
  if(words.length)return '<div class="empty">Sin resultados para “'+esc(q)+'”</div>';
  return '<div class="empty">Aún no hay palabras publicadas.'+(session?'<div class="actions" style="justify-content:center;margin-top:16px"><button class="btn" id="seed">Cargar 5 palabras de ejemplo</button></div>':'')+'</div>';
}

function allCats(){
  var seen={},out=[];
  CATS.concat(words.map(function(w){return w.category})).forEach(function(c){
    if(c&&!seen[c.toLowerCase()]){seen[c.toLowerCase()]=1;out.push(c)}
  });
  return out;
}
function viewBar(){
  return '<div class="viewbar"><button data-view="list" class="'+(view==='list'?'on':'')+'">Lista completa</button>'+
    '<button data-view="cats" class="'+(view==='cats'?'on':'')+'">Por categorías</button></div>';
}
function boxItem(x){
  return '<article class="bw"><div class="bw-top"><h3>'+esc(x.word)+'</h3>'+
    '<button class="speak" data-say="'+esc(x.word)+'" aria-label="Escuchar '+esc(x.word)+'" title="Escuchar · Listen">'+SPK+'</button></div>'+
    (x.part_of_speech?'<span class="type">'+esc(x.part_of_speech)+'</span>':'')+
    (x.translation?'<p class="tr">'+esc(x.translation)+'</p>':'')+
    '<p class="bw-def">'+esc(x.definition)+'</p>'+
    (x.example?'<p class="bw-ex">'+esc(x.example)+'</p>':'')+
    (session?'<div class="bw-act"><select class="qcat" data-qcat="'+esc(x.id)+'" aria-label="Categoría"><option value="">Asignar categoría…</option>'+allCats().map(function(c){return '<option'+(c===x.category?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select><button class="edit" data-edit="'+esc(x.id)+'">Editar</button>'+
      '<button class="del'+(pendingDel===x.id?' confirm':'')+'" data-del="'+esc(x.id)+'">'+(pendingDel===x.id?'¿Confirmar?':'Borrar')+'</button></div>':'')+
  '</article>';
}
function boxesHTML(){
  if(loading)return '<div class="empty">Cargando vocabulario…</div>';
  if(loadError)return '<div class="empty">'+esc(loadError)+'</div>';
  var l=filtered();
  if(!l.length)return '<div class="empty">'+(words.length?'Sin resultados para “'+esc(q)+'”':'Aún no hay palabras publicadas.')+'</div>';
  var g={},order=[];
  l.forEach(function(x){var c=x.category||'Sin categoría';if(!g[c]){g[c]=[];order.push(c)}g[c].push(x)});
  order.sort(function(a,b){if(a==='Sin categoría')return 1;if(b==='Sin categoría')return -1;return a.localeCompare(b,'en',{sensitivity:'base'})});
  var chips='<div class="chips"><button class="chip'+(catFilter?'':' on')+'" data-cat="">Todas<b>'+l.length+'</b></button>'+
    order.map(function(c){return '<button class="chip'+(catFilter===c?' on':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'<b>'+g[c].length+'</b></button>'}).join('')+'</div>';
  var show=(catFilter&&g[catFilter])?[catFilter]:order;
  return chips+'<div class="boxes">'+show.map(function(c){
    return '<section class="box"><h2 class="box-h"><span>'+esc(c)+'</span><b>'+g[c].length+'</b></h2><div class="box-list">'+g[c].map(boxItem).join('')+'</div></section>';
  }).join('')+'</div>';
}

function render(){
  var a=document.activeElement, focusId=a&&a.id, keep={};
  ['em','pw','nw','nt','nd','ne','nr','nc'].forEach(function(id){var el=document.getElementById(id);if(el)keep[id]=el.value});
  app.innerHTML=
  '<div class="band"><div class="wrap"><span>English Vocabulary Series · Level B2</span>'+
    '<button class="btn-link" id="openLock">'+(session?'● Modo profesor':'Acceso profesor')+'</button></div></div>'+
  '<div class="wrap">'+
  '<header class="mast"><div class="crest" aria-hidden="true"><b>ES</b></div><div>'+
    '<p class="eyebrow">Vocabulario académico de inglés</p>'+
    '<h1 class="title">Sube a <em>B2</em></h1>'+
    '<p class="sub">Level Up to B2 — An English Vocabulary Series</p>'+
    cefr()+
    '<div class="byline"><span class="lbl">Visita</span><a class="name" href="https://www.instagram.com/eduardo.linguist/" target="_blank" rel="noopener">@eduardo.linguist</a><span class="role">para mejorar tu vocabulario</span></div>'+
  '</div></header>'+
  '<section class="intro"><p>Cada palabra de esta colección corresponde al nivel B2 del Marco Común Europeo. Estúdiala, escúchala y úsala en contexto.</p>'+
    '<p class="en">Every entry in this collection is pitched at CEFR level B2. Read it, hear it, and use it in context.</p></section>'+
  adminHTML()+
  '<div class="controls"><label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>'+
    '<input id="q" type="search" placeholder="Buscar una palabra · Search a word" value="'+esc(q)+'" aria-label="Buscar"></label>'+
    '<div class="count"><b>'+words.length+'</b> palabras · entries</div></div>'+
  (demo?'<div class="demo">Vista previa con palabras de ejemplo. Conecta Firebase en config.js para publicar tu lista real.</div>':'')+
  viewBar()+
  (view==='list'?'<div class="head"><span>Palabra · Headword</span><span>Definición · Definition</span></div><div class="list">'+listHTML()+'</div>':boxesHTML())+
  '<footer><span>© '+new Date().getFullYear()+' Eduardo Stein</span><span>Sube a B2 · English · Español</span></footer>'+
  '</div>';
  Object.keys(keep).forEach(function(id){var el=document.getElementById(id);if(el)el.value=keep[id]});
  bind();
  if(focusId){var f=document.getElementById(focusId);if(f){f.focus();if(f.id==='q'){var n=f.value.length;f.setSelectionRange(n,n)}}}
}

function listen(){
  db.collection('b2_words').onSnapshot(function(snap){
    loading=false;loadError='';
    words=snap.docs.map(function(d){var x=d.data({serverTimestamps:'estimate'});return {t0:x.createdAt&&x.createdAt.toMillis?x.createdAt.toMillis():Date.now(),id:d.id,word:x.word,part_of_speech:x.part_of_speech||'',definition:x.definition,example:x.example||'',translation:x.translation||'',category:x.category||''}});
    sortWords();render();
  },function(err){loading=false;loadError='No se pudo cargar el vocabulario. Recarga la página.';console.error(err);render()});
}
function docId(w){return w.toLowerCase().trim().replace(/[\/\s]+/g,'-').slice(0,120)}

function bind(){
  var qi=document.getElementById('q');
  qi.addEventListener('input',function(){q=qi.value;render()});
  app.querySelectorAll('[data-say]').forEach(function(b){b.addEventListener('click',function(){speak(b.getAttribute('data-say'))})});
  app.querySelectorAll('[data-view]').forEach(function(b){b.addEventListener('click',function(){view=b.getAttribute('data-view');render()})});
  app.querySelectorAll('[data-cat]').forEach(function(b){b.addEventListener('click',function(){catFilter=b.getAttribute('data-cat');render()})});
  app.querySelectorAll('[data-qcat]').forEach(function(s){s.addEventListener('change',async function(){
    try{await db.collection('b2_words').doc(s.getAttribute('data-qcat')).update({category:s.value});toast('Categoría guardada')}
    catch(err){toast('No se pudo guardar.');console.error(err)}
  })});
  document.getElementById('openLock').addEventListener('click',function(){
    if(session){window.scrollTo({top:0,behavior:'smooth'});return}
    if(demo){toast('Conecta Firebase para activar el acceso del profesor');return}
    showLogin=!showLogin;render();if(showLogin)document.getElementById('em').focus();
  });
  var ul=document.getElementById('unlock');
  if(ul){
    var go=async function(){
      var m=document.getElementById('lockmsg');m.textContent='Verificando…';m.className='msg';
      try{await auth.signInWithEmailAndPassword(document.getElementById('em').value.trim(),document.getElementById('pw').value);showLogin=false;toast('Bienvenido, profesor')}
      catch(e){m.textContent='Correo o clave incorrectos.';m.className='msg err'}
    };
    ul.addEventListener('click',go);
    document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')go()});
    document.getElementById('cancelLock').addEventListener('click',function(){showLogin=false;render()});
  }
  var sd=document.getElementById('seed');
  if(sd)sd.addEventListener('click',async function(){
    sd.disabled=true;
    try{var batch=db.batch();DEMO.forEach(function(x){batch.set(db.collection('b2_words').doc(docId(x.word)),{word:x.word,part_of_speech:x.part_of_speech,definition:x.definition,example:x.example,createdAt:firebase.firestore.FieldValue.serverTimestamp()})});await batch.commit();toast('Palabras de ejemplo cargadas')}
    catch(err){sd.disabled=false;toast('No se pudieron cargar. Revisa las reglas.');console.error(err)}
  });
  app.querySelectorAll('[data-edit]').forEach(function(b){b.addEventListener('click',function(){
    var x=words.find(function(y){return y.id===b.getAttribute('data-edit')});if(!x)return;
    editing=x;pendingDel=null;render();
    document.getElementById('nw').value=x.word||'';document.getElementById('nt').value=x.part_of_speech||'';
    document.getElementById('nr').value=x.translation||'';document.getElementById('nc').value=x.category||'';document.getElementById('nd').value=x.definition||'';document.getElementById('ne').value=x.example||'';
    document.getElementById('wordpanel').scrollIntoView({behavior:'smooth',block:'start'});document.getElementById('nw').focus({preventScroll:true});
  })});
  var ce=document.getElementById('cancelEdit');
  if(ce)ce.addEventListener('click',function(){editing=null;['nw','nr','nc','nd','ne'].forEach(function(id){document.getElementById(id).value=''});document.getElementById('nt').value='';render()});
  var lk=document.getElementById('lock');
  if(lk)lk.addEventListener('click',async function(){await auth.signOut();pendingDel=null;editing=null;toast('Sesión cerrada')});
  var ad=document.getElementById('add');
  if(ad)ad.addEventListener('click',async function(){
    if(busy)return;
    var w=document.getElementById('nw').value.trim(),d=document.getElementById('nd').value.trim(),t=document.getElementById('nt').value,e=document.getElementById('ne').value.trim(),tr=document.getElementById('nr').value.trim(),cat=document.getElementById('nc').value.trim();
    var m=document.getElementById('addmsg');
    if(!w||!d){m.textContent='Escribe la palabra y su definición.';m.className='msg err';return}
    if(words.some(function(x){return x.word.toLowerCase()===w.toLowerCase()&&(!editing||x.id!==editing.id)})){m.textContent='“'+w+'” ya está en la lista.';m.className='msg err';return}
    busy=true;m.textContent='Guardando…';m.className='msg';
    try{
      if(editing)await db.collection('b2_words').doc(editing.id).update({word:w,part_of_speech:t,definition:d,example:e,translation:tr,category:cat});
      else await db.collection('b2_words').doc(docId(w)).set({word:w,part_of_speech:t,definition:d,example:e,translation:tr,category:cat,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
      busy=false;['nw','nd','ne','nr','nc'].forEach(function(id){document.getElementById(id).value=''});document.getElementById('nt').value='';
      var was=!!editing;editing=null;m.textContent='';render();toast((was?'Actualizada: ':'Guardado: ')+w);
    }catch(err){busy=false;m.textContent='No se guardó. Revisa que tu cuenta tenga permiso.';m.className='msg err';console.error(err)}
  });
  app.querySelectorAll('[data-del]').forEach(function(b){b.addEventListener('click',async function(){
    var id=b.getAttribute('data-del');
    if(pendingDel!==id){pendingDel=id;render();return}
    pendingDel=null;
    var x=words.find(function(y){return y.id===id});
    try{await db.collection('b2_words').doc(id).delete();if(editing&&editing.id===id){editing=null;render()}toast('Borrada: '+(x?x.word:''))}
    catch(err){toast('No se pudo borrar.');console.error(err);render()}
  })});
}

if(!window.firebase||!cfg.apiKey||cfg.apiKey.indexOf('PEGA')===0){
  demo=true;loading=false;words=DEMO.slice();render();return;
}
render();
firebase.initializeApp(cfg);
auth=firebase.auth();db=firebase.firestore();
auth.onAuthStateChanged(function(u){session=u;pendingDel=null;render()});
listen();
})();
</script>
</body>
</html>
